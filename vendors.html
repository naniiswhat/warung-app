<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Warung - Urus Vendor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="view-transition" content="same-origin">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <div class="container">
        <nav class="nav-menu">
            <a href="index.html">Dashboard Harian</a>
            <a href="vendors.html" class="active">Urus Vendor</a>
            <a href="sejarah.html">Sejarah & Laporan</a>
        </nav>

        <div class="management-grid">
            <div class="form-panel">
                <h2>Urus Vendor & Katalog</h2>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label style="color: var(--accent-gold); font-size: 1.1rem;">1. Tambah Vendor Baru</label>
                    <input type="text" id="newVendorName" placeholder="Nama (Cth: Makcik Kiah)">
                    <button id="btnAddVendor" class="btn-primary">+ Tambah Vendor</button>
                </div>

                <hr style="border: 1px solid var(--border-color); margin-bottom: 20px;">

                <div class="form-group">
                    <label style="color: var(--accent-gold); font-size: 1.1rem;">2. Tambah Makanan</label>
                    <select id="selectVendorForFood" style="margin-bottom: 12px;"></select>
                    <input type="text" id="newFoodName" placeholder="Nama Makanan" style="margin-bottom: 12px;">

                    <!-- NEW: Pricing Mode Toggle -->
                    <div
                        style="display: flex; gap: 4px; margin-bottom: 12px; background: var(--bg-input); padding: 4px; border-radius: 8px; width: max-content;">
                        <button id="btnJenisTetap" class="toggle-btn active" style="padding: 6px 16px;">RM
                            Tetap</button>
                        <button id="btnJenisPeratus" class="toggle-btn" style="padding: 6px 16px;">Peratus (%)</button>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Jual (RM)</label>
                            <input type="number" id="newHargaJ" value="1.00" step="0.10">
                        </div>
                        <div class="form-group">
                            <!-- This label will change based on the toggle -->
                            <label id="labelHargaV">Modal Vendor (RM)</label>
                            <input type="number" id="newHargaV" value="0.70" step="0.10">
                        </div>
                    </div>
                    <button id="btnAddFood" class="btn-primary">+ Tambah Makanan</button>
                </div>

                <hr style="border: 1px solid var(--border-color); margin: 20px 0;">

                <div>
                    <label style="color: var(--accent-gold); font-size: 1.1rem;">3. Backup Data Sistem</label>
                    <button onclick="exportSemuaData()" class="btn-primary" style="margin-bottom: 8px;">📥 Muat Turun
                        Backup (Export)</button>
                    <input type="file" id="importFile" accept=".json" style="padding: 8px; font-size: 0.9rem;">
                    <button id="btnImport" class="btn-primary"
                        style="margin-top: 8px; background-color: transparent; border: 1.5px solid var(--accent-gold); color: var(--accent-gold);">📤
                        Masukkan Backup (Import)</button>
                </div>
            </div>

            <!-- RIGHT PANEL: Live Catalog with Sorting -->
            <div class="feed-panel">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                    <h2 style="margin-bottom: 0; border: none;">Senarai Katalog</h2>
                    <select id="sortKatalog" style="width: auto; padding: 6px 12px; font-size: 0.95rem;">
                        <option value="az">Susun: A - Z</option>
                        <option value="za">Susun: Z - A</option>
                    </select>
                </div>
                <div id="katalogContainer"></div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="vendors.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
</body>

</html>
