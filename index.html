<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Warung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <div class="container">
        <nav class="nav-menu">
            <a href="index.html" class="active">Dashboard Harian</a>
            <a href="vendors.html">Urus Vendor</a>
            <a href="sejarah.html">Sejarah</a>
        </nav>

        <h2>Rekod Jualan Harian</h2>

        <div class="form-group">
            <label>Nama Vendor</label>
            <select id="vendorName"></select>
        </div>

        <div class="form-group">
            <label>Nama Makanan (Contoh: Nasi Lemak)</label>
            <select id="foodName"></select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Harga Vendor (RM)</label>
                <input type="number" id="hargaVendor" value="1.00" step="0.10">
            </div>
            <div class="form-group">
                <label>Harga Jual (RM)</label>
                <input type="number" id="hargaJual" value="1.50" step="0.10">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Kuantiti Hantar</label>
                <input type="number" id="qtyHantar" value="20">
            </div>
            <div class="form-group">
                <label>Kuantiti Laku</label>
                <input type="number" id="qtyLaku" value="0">
            </div>
        </div>

        <button id="btnTambah" class="btn-primary">Tambah ke Senarai</button>

        <div id="senaraiContainer"></div>

        <div class="results grand-total">
            <p>Jumlah Keseluruhan Vendor: RM <span id="grandPayout">0.00</span></p>
            <p><strong>Jumlah Untung Bersih: RM <span id="grandUntung">0.00</span></strong></p>
            <button id="btnTutup" class="btn-danger">Tutup Kedai (Padam Semua)</button>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="app.js"></script>
</body>

</html>
