<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Warung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="view-transition" content="same-origin">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <div class="container">
        <nav class="nav-menu">
            <a href="index.html" class="active">Dashboard Harian</a>
            <a href="vendors.html">Urus Vendor</a>
            <a href="sejarah.html">Sejarah & Laporan</a>
        </nav>

        <div class="dashboard-grid">
            <!-- Left Side: Workflow Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; color: var(--text-muted); border-bottom: none; margin-bottom: 4px;">
                    LANGKAH 1</h2>
                <h2 style="margin-top: 0; padding-top: 0;">Sesi Pagi (Terima Barang)</h2>

                <div class="form-group">
                    <label>Nama Vendor</label>
                    <select id="vendorName"></select>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Nama Makanan</label>
                    <select id="foodName" style="margin-bottom: 6px;"></select>
                    <p id="pricePreview" style="font-size: 0.85rem; color: var(--accent-gold);"></p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kuantiti Dihantar</label>
                        <input type="number" id="qtyHantar" value="20" min="1">
                    </div>
                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <button id="btnTambahPagi" class="btn-primary" style="margin-bottom: 2px;">+ Masuk Sesi</button>
                    </div>
                </div>

                <hr style="border: 1px solid var(--border-color); margin: 28px 0;">

                <h2 style="font-size: 1.1rem; color: var(--text-muted); border-bottom: none; margin-bottom: 4px;">
                    LANGKAH 2</h2>
                <h2 style="margin-top: 0; padding-top: 0;">Sesi Petang (Tutup)</h2>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">Sahkan baki di panel kanan
                    untuk melengkapkan pengiraan.</p>

                <div class="results grand-total">
                    <p>Jumlah Payout: <span>RM <b id="grandPayout">0.00</b></span></p>
                    <p>Untung Bersih: <span>RM <b id="grandUntung">0.00</b></span></p>
                    <button id="btnTutup" class="btn-danger" style="margin-top: 16px;">Tutup Kedai & Simpan
                        Sejarah</button>
                </div>
            </div>

            <!-- Right Side: Active Session Feed -->
            <div class="feed-panel">
                <h2 style="text-align: left; margin-bottom: 12px;">Senarai Sesi Semasa</h2>
                <div id="senaraiContainer"></div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
</body>

</html>
